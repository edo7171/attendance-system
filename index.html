<style>
  :root{
    --ink:#152238;
    --ink-soft:#3d4a63;
    --bg:#F1F4F7;
    --surface:#FFFFFF;
    --border:#DCE3EA;
    --teal:#1F7A72;
    --teal-dark:#155C56;
    --amber:#C98A2C;
    --coral:#C4553F;
    --shadow: 0 1px 2px rgba(21,34,56,.06), 0 4px 14px rgba(21,34,56,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: "Segoe UI", "Heebo", "Arial Hebrew", Arial, sans-serif;
    min-height:100vh;
  }
  #app{max-width:1180px;margin:0 auto;padding:28px 22px 60px;}

  .top-bar{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px; margin-bottom:26px;
  }
  .top-bar h1{
    font-size:1.5rem; margin:0; font-weight:700; letter-spacing:-0.01em;
  }
  .top-bar .sub{color:var(--ink-soft); font-size:.85rem; margin-top:4px;}
  .top-bar .brand{display:flex; flex-direction:column;}

  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:6px;
    padding:9px 16px; font-size:.9rem; font-weight:600;
    transition:background .15s ease, transform .05s ease;
  }
  button:active{transform:translateY(1px);}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--border);}
  .btn-ghost:hover{background:#fff; border-color:var(--ink-soft);}
  .btn-danger{background:transparent; color:var(--coral); border:1px solid var(--coral);}
  .btn-danger:hover{background:var(--coral); color:#fff;}
  .btn-small{padding:5px 10px; font-size:.78rem; border-radius:5px;}
  button:disabled{opacity:.5; cursor:not-allowed;}

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); padding:22px;
  }

  .banner{
    padding:12px 16px; border-radius:8px; font-size:.88rem; margin-bottom:18px;
    border:1px solid transparent;
  }
  .banner.error{background:#FBEAE6; color:#8B3524; border-color:#EFC5B8;}
  .banner.info{background:#EAF3F2; color:#155C56; border-color:#C7E1DD;}

  /* ---- Courses list ---- */
  .courses-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .course-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px;}
  .course-card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; cursor:pointer; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:6px; transition:border-color .15s;
  }
  .course-card:hover{border-color:var(--teal);}
  .course-card h3{margin:0; font-size:1.05rem;}
  .course-card .meta{font-size:.8rem; color:var(--ink-soft);}
  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
    border:1px dashed var(--border); border-radius:10px; background:var(--surface);
  }

  /* ---- Create course form ---- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:.82rem; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px;
    font-size:.92rem; font-family:inherit; background:#fcfdfe; color:var(--ink);

  }
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row-3{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:10px;}

  .sessions-list{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .session-row{
    display:grid; grid-template-columns:28px 1.4fr 1fr 1fr; gap:10px; align-items:center;
    background:#F8FAFB; border:1px solid var(--border); border-radius:8px; padding:8px 10px;

  .form-actions{display:flex; gap:10px; justify-content:flex-start; margin-top:6px;}

  .att-box{

  .phone-cell{white-space:nowrap; font-variant-numeric:tabular-nums;}

/* =========================================================
   Helpers
   ========================================================= */
function el(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  for(const k in attrs){
    const v = attrs[k];
    if(v === undefined || v === false) continue;
    if(k === "class") node.className = v;
    else if(k === "html") node.innerHTML = v;
    else if(k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  (children||[]).forEach(c => {
    if(c === null || c === undefined) return;
    if(typeof c === "string") node.appendChild(document.createTextNode(c));
    else node.appendChild(c);
  });
  return node;
}

function showBanner(message, type){
  const host = document.getElementById("bannerHost");
  host.innerHTML = "";
  if(!message) return;
  host.appendChild(el("div", {class:"banner " + (type||"info")}, [message]));
}

function clearBanner(){ document.getElementById("bannerHost").innerHTML = ""; }

function formatDate(d){
  if(!d) return "";
  try{
    const parts = d.split("-");
    if(parts.length===3) return parts[2]+"/"+parts[1]+"/"+parts[0];
  }catch(e){}
  return d;
}

/* =========================================================
   Branches: loaded from the local BRANCHES constant above
   (no external database call needed).
   ========================================================= */
async function loadBranches(){
  state.branches = BRANCHES.slice().sort((a,b)=> (a.code||0) - (b.code||0));
  state.branchesLoaded = true;
}

/* =========================================================
   Firestore: courses (korsim project)
   ========================================================= */
function subscribeCourses(){
  if(state.unsubscribeCourses) state.unsubscribeCourses();
  state.unsubscribeCourses = dbKorsim.collection("courses")
    .orderBy("createdAt", "desc")
    .onSnapshot(snap=>{
      state.courses = snap.docs.map(d=>({id:d.id, ...d.data()}));
      clearBanner();
      render();
    }, err=>{
      console.error(err);
      showBanner("שגיאה בטעינת רשימת הקורסים מה-Database: " + err.message + ". ייתכן שיש להתאים את חוקי האבטחה (Firestore Rules) של פרויקט korsim.", "error");
    });
}

async function createCourse(name, sessions){
  await dbKorsim.collection("courses").add({
    name: name,
    sessions: sessions,
    registrationOpen: true,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

async function deleteCourse(courseId){
  // delete participants subcollection first
  const partsSnap = await dbKorsim.collection("courses").doc(courseId).collection("participants").get();
  const batch = dbKorsim.batch();
  partsSnap.forEach(d=> batch.delete(d.ref));
  batch.delete(dbKorsim.collection("courses").doc(courseId));
  await batch.commit();
}

/* =========================================================
   Firestore: participants (subcollection of a course)
   ========================================================= */
function subscribeParticipants(courseId){
  if(state.unsubscribeParticipants) state.unsubscribeParticipants();
  state.unsubscribeParticipants = dbKorsim.collection("courses").doc(courseId).collection("participants")
    .orderBy("lastName")
    .onSnapshot(snap=>{
      state.participants = snap.docs.map(d=>({id:d.id, ...d.data()}));
      clearBanner();
      render();
    }, err=>{
      console.error(err);
      showBanner("שגיאה בטעינת המשתתפים: " + err.message, "error");
    });
}

async function addParticipant(courseId, data){
  const attendance = {};
  const course = state.courses.find(c=>c.id===courseId);
  const sessionCount = course && course.sessions ? course.sessions.length : 0;
  for(let i=0;i<sessionCount;i++){ attendance[i] = {start:false, end:false, startTime:"", endTime:""}; }
  await dbKorsim.collection("courses").doc(courseId).collection("participants").add({
    firstName: data.firstName,
    lastName: data.lastName,

function nowTimeString(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return hh + ":" + mm;
}

async function toggleAttendance(courseId, participantId, sessionIdx, which, currentVal){
  const newVal = !currentVal;
  const update = {};
  update["attendance." + sessionIdx + "." + which] = newVal;
  // record the moment the check was made; clear it when unchecking
  update["attendance." + sessionIdx + "." + which + "Time"] = newVal ? nowTimeString() : "";
  await dbKorsim.collection("courses").doc(courseId).collection("participants").doc(participantId).update(update);
}

function minutesFromTimeString(t){
  if(!t || typeof t !== "string") return null;
  const m = t.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

// Hours credited for one session: strictly the actual time recorded.
// Both start AND end must be marked with real times, otherwise 0.
function sessionHours(session, att){
  if(!att.start || !att.end) return 0;
  const startMin = minutesFromTimeString(att.startTime);
  const endMin   = minutesFromTimeString(att.endTime);
  if(startMin === null || endMin === null) return 0;
  if(endMin <= startMin) return 0;
  return (endMin - startMin) / 60;
}

async function exportToExcel(){
  const course = state.currentCourse;
  if(!course) return;
  const sessions = course.sessions || [];

  const workbook = new ExcelJS.Workbook();
  const sheet = workbook.addWorksheet("נוכחות", { views: [{ rightToLeft: true }] });

  const header = ["שם פרטי","שם משפחה","ת.ז","טלפון","סניף"];
  sessions.forEach((s,i)=>{
    const label = (s.date ? formatDate(s.date) : ("מפגש "+(i+1)));
    header.push(label + " - התחלה");
    header.push(label + " - שעת התחלה");
    header.push(label + " - סיום");
    header.push(label + " - שעת סיום");
  });
  header.push("הערות", "חוות דעת", "אחוז נוכחות", "סה\"כ שעות נוכחות");

  const headerRow = sheet.addRow(header);
  headerRow.eachCell(cell=>{
    cell.font = { bold:true, color:{argb:"FFFFFFFF"} };
    cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:"FF14213D"} };
    cell.alignment = { horizontal:"center", vertical:"middle", wrapText:true };
  });

  const fixedColsCount = 5; // first name, last name, id, phone, branch

  state.participants.forEach(p=>{
    const row = [p.firstName||"", p.lastName||"", p.teudatZehut||"", p.phone||"", p.branchName||""];
    let completeSessions = 0;
    let totalHours = 0;

    sessions.forEach((s,i)=>{
      const att = (p.attendance && p.attendance[i]) || {};
      // a session counts only when it is complete: both start and end marked
      if(att.start && att.end) completeSessions++;
      totalHours += sessionHours(s, att);
      ["start","end"].forEach(which=>{
        row.push(att[which] ? "נכח" : "לא נכח");
        row.push(att[which] ? (att[which+"Time"] || "") : "");
      });
    });

    row.push(p.notes||"", p.feedback||"");
    const pct = sessions.length ? (completeSessions / sessions.length) : 0;
    row.push(pct);
    row.push(Math.round(totalHours * 100) / 100);

    const addedRow = sheet.addRow(row);

    // color absent cells red; time cells stay neutral
    let colIndex = fixedColsCount;
    sessions.forEach((s,i)=>{
      const att = (p.attendance && p.attendance[i]) || {};
      ["start","end"].forEach(which=>{
        colIndex++;
        const statusCell = addedRow.getCell(colIndex);
        statusCell.alignment = { horizontal:"center" };
        if(!att[which]){
          statusCell.font = { color: { argb: "FFCC0000" } };
        }
        colIndex++;
        const timeCell = addedRow.getCell(colIndex);
        timeCell.alignment = { horizontal:"center" };
        timeCell.numFmt = "@";
      });
    });

    // phone column: keep as text so a leading zero isn't dropped
    const phoneCell = addedRow.getCell(4);
    phoneCell.numFmt = "@";
    phoneCell.alignment = { horizontal:"center" };

    // attendance percentage
    const pctCell = addedRow.getCell(header.length - 1);
    pctCell.numFmt = "0%";
    pctCell.alignment = { horizontal:"center" };

    // total hours
    const hoursCell = addedRow.getCell(header.length);
    hoursCell.numFmt = "0.00";
    hoursCell.alignment = { horizontal:"center" };
    hoursCell.font = { bold:true };
  });

  sheet.columns.forEach((col, i)=>{
    col.width = (i < fixedColsCount) ? 16 : 15;
  });
  sheet.getColumn(header.length - 3).width = 24; // הערות
  sheet.getColumn(header.length - 2).width = 24; // חוות דעת
  sheet.getColumn(header.length).width = 18;     // סה"כ שעות נוכחות

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const safeName = (course.name || "קורס").replace(/[\\/:*?"<>|]/g,"_");
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "דוח_נוכחות_" + safeName + ".xlsx";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  const header = el("div",{class:"detail-header"},[
    el("div",{},[
      el("h2",{},[course.name || "(ללא שם)"]),
      el("div",{class:"meta"},[sessions.length + " מפגשים · " + state.participants.length + " משתתפים"])
    ]),
    el("div",{class:"detail-actions"},[
      el("button",{class:"btn-primary", onclick:()=>{ state.showAddParticipant = true; render(); }},["+ הוסף משתתף"]),
      el("button",{class:"btn-ghost", onclick:()=>{ state.showRegLink = true; render(); }},["קישור הרשמה"]),
      el("button",{class:"btn-ghost", onclick: exportToExcel},["ייצוא לאקסל"]),
    ])
  ]);
  host.appendChild(header);

  if(!state.participants.length){
    host.appendChild(el("div",{class:"empty-state"},["אין עדיין משתתפים בקורס זה. לחצו על \"הוסף משתתף\" כדי להתחיל."]));
    renderParticipantModal();
    renderRegLinkModal();
    return;
  }

  const wrap = el("div",{class:"table-wrap"});
  const table = el("table");

  const sessionHeadRow = el("tr",{class:"session-head"},[
    el("th",{rowspan:"2"},["#"]),
    el("th",{rowspan:"2"},["שם פרטי"]),
    el("th",{rowspan:"2"},["שם משפחה"]),
    el("th",{rowspan:"2"},["ת.ז"]),
    el("th",{rowspan:"2"},["טלפון"]),
    el("th",{rowspan:"2"},["סניף"]),
  ]);
  sessions.forEach((s,i)=>{
    const label = s.date ? formatDate(s.date) : ("מפגש "+(i+1));
    sessionHeadRow.appendChild(el("th",{colspan:"2", class:"sess-group"},[label]));
  });
  sessionHeadRow.appendChild(el("th",{rowspan:"2"},["הערות"]));
  sessionHeadRow.appendChild(el("th",{rowspan:"2"},["חוות דעת"]));
  sessionHeadRow.appendChild(el("th",{rowspan:"2"},[""]));

  const subHeadRow = el("tr");
  sessions.forEach(()=>{
    subHeadRow.appendChild(el("th",{},["התחלה"]));
    subHeadRow.appendChild(el("th",{class:"sess-end"},["סיום"]));
  });

  const thead = el("thead",{},[sessionHeadRow, subHeadRow]);
  table.appendChild(thead);

  const tbody = el("tbody");
  state.participants.forEach((p, idx)=>{
    const tr = el("tr");
    tr.appendChild(el("td",{class:"col-idx"},[String(idx+1)]));
    tr.appendChild(el("td",{class:"name-cell"},[p.firstName||""]));
    tr.appendChild(el("td",{class:"name-cell"},[p.lastName||""]));
    tr.appendChild(el("td",{},[p.teudatZehut||""]));
    tr.appendChild(el("td",{class:"phone-cell"},[
      p.phone ? el("a",{href:"tel:"+String(p.phone).replace(/[^\d+]/g,""), class:"phone-link"},[p.phone]) : ""
    ]));
    tr.appendChild(el("td",{},[p.branchName||""]));

    sessions.forEach((s,i)=>{
      const att = (p.attendance && p.attendance[i]) || {start:false,end:false};
      ["start","end"].forEach(which=>{
        const on = !!att[which];
        const markedAt = att[which+"Time"] || "";
        const box = el("div",{class:"att-box"+(on?" on":"")},[on?"✓":""]);
        const cellContent = [box];
        if(on && markedAt){
          cellContent.push(el("div",{class:"att-time"},[markedAt]));
        }
        const tip = (which==="start" ? "נוכחות בתחילת המפגש" : "נוכחות בסיום המפגש")
                    + (on && markedAt ? " · סומן ב-" + markedAt : "");
        const td = el("td",{class:"att-cell"+(which==="end"?" sess-end":""), title: tip, onclick: async ()=>{
          try{
            await toggleAttendance(state.currentCourseId, p.id, i, which, on);
          }catch(e){
            showBanner("שגיאה בעדכון נוכחות: "+e.message,"error");
          }
        }}, cellContent);
        tr.appendChild(td);
      });
    });

    const notesTd = el("td",{});
    const notesArea = el("textarea",{rows:"1", placeholder:"הערות..."},[]);
    notesArea.value = p.notes || "";
    let notesTimer;
    notesArea.addEventListener("input", ()=>{
      clearTimeout(notesTimer);
      notesTimer = setTimeout(()=>{
        updateParticipantField(state.currentCourseId, p.id, "notes", notesArea.value)
          .catch(e=>showBanner("שגיאה בשמירת הערה: "+e.message,"error"));
      }, 600);
    });
    notesTd.appendChild(notesArea);
    tr.appendChild(notesTd);

    const feedbackTd = el("td",{});
    const feedbackArea = el("textarea",{rows:"1", placeholder:"חוות דעת..."},[]);
    feedbackArea.value = p.feedback || "";
    let fbTimer;
    feedbackArea.addEventListener("input", ()=>{
      clearTimeout(fbTimer);
      fbTimer = setTimeout(()=>{
        updateParticipantField(state.currentCourseId, p.id, "feedback", feedbackArea.value)
          .catch(e=>showBanner("שגיאה בשמירת חוות דעת: "+e.message,"error"));
      }, 600);
    });
    feedbackTd.appendChild(feedbackArea);
    tr.appendChild(feedbackTd);

    const actionsTd = el("td",{class:"col-actions"});
    actionsTd.appendChild(el("button",{class:"icon-btn edit-btn", title:"ערוך משתתף", onclick:()=>{
      state.editParticipant = p;
      render();
    }},["✎"]));
    actionsTd.appendChild(el("button",{class:"icon-btn", title:"מחק משתתף", onclick:()=>{
      if(confirm("למחוק את "+(p.firstName||"")+" "+(p.lastName||"")+"?")){
        deleteParticipant(state.currentCourseId, p.id).catch(e=>showBanner("שגיאה במחיקה: "+e.message,"error"));
      }
    }},["✕"]));
    tr.appendChild(actionsTd);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  host.appendChild(wrap);

  renderParticipantModal();
  renderRegLinkModal();
}

function render(){
  if(!state.authChecked){
    document.getElementById("topBarActions").innerHTML = "";
    document.getElementById("viewHost").innerHTML = "";
    clearBanner();
    return;
  }
  if(!state.user){
    clearBanner();
    renderLogin();
    return;
  }

  renderTopBarActions();
  const existingOverlay = document.querySelector(".modal-overlay");
  if(existingOverlay) existingOverlay.remove();

  if(state.view === "list") renderList();
  else if(state.view === "create") renderCreate();
  else if(state.view === "detail") renderDetail();
}

/* =========================================================
   Init
   ========================================================= */
/* ---------- Public self-registration page ---------- */
const regState = {
  loading: true,
  course: null,
  error: "",
  submitting: false,
  done: false,
};

function renderRegistration(){
  const host = document.getElementById("viewHost");
  document.getElementById("topBarActions").innerHTML = "";
  host.innerHTML = "";

  const wrap = el("div",{class:"login-wrap"});
  const panel = el("div",{class:"login-panel"});

  if(regState.loading){
    panel.appendChild(el("h2",{},["טוען..."]));
    panel.appendChild(el("div",{class:"sub"},["רגע אחד, טוען את פרטי הקורס."]));
    wrap.appendChild(panel); host.appendChild(wrap);
    return;
  }

  if(regState.error){
    panel.appendChild(el("h2",{},["לא ניתן להירשם"]));
    panel.appendChild(el("div",{class:"banner error"},[regState.error]));
    wrap.appendChild(panel); host.appendChild(wrap);
    return;
  }

  if(regState.done){
    panel.appendChild(el("h2",{},["ההרשמה נקלטה"]));
    panel.appendChild(el("div",{class:"banner info"},[
      "נרשמת בהצלחה לקורס \"" + (regState.course.name || "") + "\". נתראה במפגש הראשון!"
    ]));
    panel.appendChild(el("button",{class:"btn-ghost", onclick:()=>{
      regState.done = false;
      renderRegistration();
    }},["רישום משתתף נוסף"]));
    wrap.appendChild(panel); host.appendChild(wrap);
    return;
  }

  const course = regState.course;
  panel.appendChild(el("h2",{},["הרשמה לקורס"]));
  panel.appendChild(el("div",{class:"sub"},[course.name || ""]));

  const firstInput = el("input",{type:"text", id:"r_first"});
  const lastInput  = el("input",{type:"text", id:"r_last"});
  const idInput    = el("input",{type:"text", id:"r_id", inputmode:"numeric", maxlength:"9"});

  panel.appendChild(el("div",{class:"field"},[el("label",{},["שם פרטי"]), firstInput]));
  panel.appendChild(el("div",{class:"field"},[el("label",{},["שם משפחה"]), lastInput]));
  panel.appendChild(el("div",{class:"field"},[el("label",{},["ת.ז"]), idInput]));

  const branchSelect = el("select",{id:"r_branch"});
  branchSelect.appendChild(el("option",{value:""},["בחר סניף..."]));
  state.branches.forEach(b=>{
    const label = (b.code ? (b.code + " - ") : "") + b.name;
    branchSelect.appendChild(el("option",{value:b.id, "data-name":label},[label]));
  });
  panel.appendChild(el("div",{class:"field"},[el("label",{},["מספר סניף"]), branchSelect]));

  const errHost = el("div",{});
  panel.appendChild(errHost);

  const submitBtn = el("button",{class:"btn-primary", disabled: regState.submitting || undefined, onclick: async ()=>{
    const firstName = firstInput.value.trim();
    const lastName  = lastInput.value.trim();
    const teudatZehut = idInput.value.trim();
    const branchId = branchSelect.value;
    const branchName = branchSelect.selectedOptions[0]
      ? (branchSelect.selectedOptions[0].getAttribute("data-name") || "") : "";

    errHost.innerHTML = "";
    if(!firstName || !lastName || !teudatZehut || !branchId){
      errHost.appendChild(el("div",{class:"banner error"},["יש למלא את כל השדות."]));
      return;
    }

    regState.submitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = "שולח...";
    try{
      const attendance = {};
      const sessionCount = (regState.course.sessions || []).length;
      for(let i=0;i<sessionCount;i++){
        attendance[i] = {start:false, end:false, startTime:"", endTime:""};
      }
      await dbKorsim.collection("courses").doc(REGISTER_COURSE_ID)
        .collection("participants").add({
          firstName, lastName, teudatZehut,
          phone: "",
          branchId, branchName,
          notes: "", feedback: "",
          attendance: attendance,
          selfRegistered: true,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      regState.submitting = false;
      regState.done = true;
      renderRegistration();
    }catch(e){
      regState.submitting = false;
      submitBtn.disabled = false;
      submitBtn.textContent = "הירשם לקורס";
      errHost.appendChild(el("div",{class:"banner error"},["ההרשמה נכשלה: " + e.message]));
    }
  }},["הירשם לקורס"]);
  panel.appendChild(submitBtn);

  wrap.appendChild(panel);
  host.appendChild(wrap);
}

async function initRegistrationMode(){
  document.querySelector(".top-bar .sub").textContent = "טופס הרשמה";
  await loadBranches();
  renderRegistration();
  try{
    // anonymous sign-in lets the public form write without a staff account
    if(!korsimAuth.currentUser){
      await korsimAuth.signInAnonymously();
    }
    const doc = await dbKorsim.collection("courses").doc(REGISTER_COURSE_ID).get();
    if(!doc.exists){
      regState.error = "הקורס לא נמצא. ייתכן שהקישור שגוי או שהקורס נמחק.";
    } else {
      const data = doc.data();
      if(data.registrationOpen === false){
        regState.error = "ההרשמה לקורס זה סגורה.";
      } else {
        regState.course = { id: doc.id, ...data };
      }
    }
  }catch(e){
    regState.error = "שגיאה בטעינת הקורס: " + e.message;
  }
  regState.loading = false;
  renderRegistration();
}

/* ---------- Staff app init ---------- */
let dataLoadedForSession = false;

korsimAuth.onAuthStateChanged((user)=>{
  if(IS_REGISTER_MODE) return;   // public form manages its own screen
  // an anonymous session (left over from the public form) is not a staff login
  if(user && user.isAnonymous) user = null;
  state.authChecked = true;
  state.user = user;
  state.loginLoading = false;
  state.loginError = "";

  if(user && !dataLoadedForSession){
    dataLoadedForSession = true;
    showBanner("טוען נתונים...", "info");
    loadBranches().then(()=> subscribeCourses());
  }

  if(!user){
    dataLoadedForSession = false;
    if(state.unsubscribeCourses){ state.unsubscribeCourses(); state.unsubscribeCourses = null; }
    if(state.unsubscribeParticipants){ state.unsubscribeParticipants(); state.unsubscribeParticipants = null; }
    state.courses = [];
    state.participants = [];
    state.view = "list";
    state.currentCourseId = null;
    state.currentCourse = null;
  }

  render();
});

if(IS_REGISTER_MODE){
  initRegistrationMode();
} else {
  render();
}
</script>
